# 🚀 腾讯云 CNB / 云原生 CI 流水线定义
# Universal Game Dev Agent Studio — 工业级自动化门禁流水线

version: 1.0
name: universal-game-agent-ci-pipeline

stages:
  - name: 1. Core Module & CLI Extended Smoke Test
    tasks:
      - script: python -m unittest discover -s tests

  - name: 2. Industrial Standards Regression Matrix (13 Gates)
    tasks:
      - script: python pipeline/test_all_standards.py

  - name: 3. Commercial Release Gate & WeChat 4MB Audit
    tasks:
      - script: python pipeline/release_gate.py

  - name: 4. Master Expert Acceptance Panel (Zero-Placeholder Review)
    tasks:
      - script: python expert_review.py
